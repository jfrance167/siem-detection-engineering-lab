name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile siem_lab.py tests/test_siem_lab.py
      - name: Test
        run: python -W error -m unittest discover -s tests -v
      - name: Rebuild sample evidence
        run: >-
          python siem_lab.py analyze samples/events.jsonl
          --rules rules/detections.json
          --alerts reports/verified-alerts.jsonl
          --report reports/verified-report.md
