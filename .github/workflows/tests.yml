name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile siem_lab.py tests/test_siem_lab.py
      - name: Test
        run: python -W error -m unittest discover -s tests -v
      - name: Rebuild sample evidence
        run: >-
          python siem_lab.py analyze samples/events.jsonl
          --rules rules/detections.json
          --alerts reports/verified-alerts.jsonl
          --report reports/verified-report.md

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      # Run Gitleaks directly so the scan does not depend on the push event's
      # `before` commit. The wrapper action builds a `<before>^..<after>` range,
      # which is invalid for an initial/root commit and after some force-pushes.
      - name: Scan repository for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
        with:
          args: detect --source . --redact --verbose --exit-code 2
